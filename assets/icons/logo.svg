<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield / Hexagon Frame -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="#0d1424" stroke="url(#primaryGrad)" stroke-width="2.5" />
  
  <!-- Water Waves Silhouette -->
  <path d="M10 28 C 14 24, 18 32, 24 28 C 30 24, 34 32, 38 28" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M12 34 C 16 31, 20 37, 24 34 C 28 31, 32 37, 36 34" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  
  <!-- Code Symbol Brackets < / > -->
  <path d="M16 16 L11 20 L16 24" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M32 16 L37 20 L32 24" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M26 14 L22 26" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" />
</svg>
